{% extends "layout.html" %}
   
{% block content %} <!-- this code extends from layout.html and defines the content block that will be rendered in home.html -->
        <!-- looping through the posts we have accessing their data -->
        {% for post in posts %}
            <div>
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <p>By {{ post.author }} on {{ post.date_posted }}</p>
                <p>=========================</p>
            </div>
        {% endfor %}
{% endblock %}
